[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datastage-platform"
version = "0.1.0"
description = "Procesamiento autónomo DataStage con FastAPI y SQL Server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "pyodbc>=5,<6", "XlsxWriter>=3.2,<4",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "azure-identity>=1.20,<2",
  "azure-ai-projects>=2.0,<3", "reportlab>=4.4,<5"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "openpyxl>=3.1,<4", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["resources/project-maps/*.json", "resources/project-maps/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["sqlserver: requires DATASTAGE_TEST_SQLSERVER_URL"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
